<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAuthn 註冊</title>
</head>

<body>
    <h2>WebAuthn 註冊</h2>
    <input type="text" id="username" placeholder="輸入使用者名稱">
    <button onclick="register()">註冊</button>

    <script>

        function base64UrlToUint8Array(base64Url) {
                // 使用 base64url 解碼
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');  // base64url -> base64
                const padding = '='.repeat((4 - (base64.length % 4)) % 4);  // 確保正確的 padding
                const base64WithPadding = base64 + padding;
                const rawData = atob(base64WithPadding);  // base64 -> 原始資料
                const uint8Array = new Uint8Array(rawData.length);
                for (let i = 0; i < rawData.length; i++) {
                    uint8Array[i] = rawData.charCodeAt(i);
                }
                return uint8Array;
            }
        async function register() {
            const username = document.getElementById("username").value;
            if (!username) {
                alert("請輸入使用者名稱");
                return;
            }

            try {
                // 向後端請求 WebAuthn 註冊選項
                const response = await fetch("http://127.0.0.1:5000/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username }),
                });

                const options = await response.json();
                console.log("註冊選項:", options);

                // 將選項轉換為 WebAuthn API 可用的格式
                options.challenge = base64UrlToUint8Array(options.challenge);
                options.user.id = base64UrlToUint8Array(options.user.id);

                // 呼叫 WebAuthn API 進行註冊
                const credential = await navigator.credentials.create({ publicKey: options });
                console.log("憑證:", credential);

                alert("註冊成功！請查看開發者控制台。");
            } catch (error) {
                console.error("註冊錯誤:", error);
                alert("註冊失敗！");
            }
        }
    </script>
</body>

</html>
