<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebAuthn 測試</title>
</head>

<body>
    <h2>Https 網頁中的 WebAuthn 註冊</h2>
    <!-- 使用者名稱輸入框 -->
    <label for="username">使用者名稱:</label>
    <input type="text" id="username" />
    <hr />
    <!-- 第一步: 向後端註冊使用者 -->
    <p> 將使用者 ID 傳給後端並取得回傳憑證後再儲存到瀏覽器 </p>
    <button onclick="register()">註冊 ID</button>
    <hr />
    <!-- 第二步: 向後端確認使用者存在後從瀏覽器取得憑證 -->
    <p>1.向後端確認使用者存在</p>
    <p>2.後端回傳使用者資料再從瀏覽器取得憑證</p>
    <p>3.將憑證傳給後端完成登入，</p>
    <button onclick="verify_register()">用 ID 登入</button>
    <hr />

    <!-- 清除憑證資訊 -->
    <button onclick="clearData()">清除全部憑證資訊(All Users)</button>
    <hr />
    <!-- 顯示憑證資訊 -->
    <h2>向後端註冊後回傳給瀏覽器的憑證資料:</h2>
    <pre id="Register_credentialInfo"></pre>
    <h2>後端認證結果</h2>
    <pre id="verify-register_credentialInfo"></pre>

    <!-- 函式 -->
    <script>
        // new Uint8Array(arg) 會將 arg 轉換為 Uint8Array
        function New_Uni8ArrayToBase64Url(arg) {
            return uint8ArrayToBase64Url(new Uint8Array(arg));
        }

        // 將 ArrayBuffer 轉換為 base64 字串
        function arrayBufferToBase64(buffer) {
            let binary = "";
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary); // Base64 編碼
        }

        // 將 base64url 字串轉換為 Uint8Array
        function base64UrlToUint8Array(base64Url) {
            if (!base64Url) {
                throw new Error("base64Url is undefined");
            }
            const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/"); // base64url -> base64
            const padding = "=".repeat((4 - (base64.length % 4)) % 4); // 確保正確的 padding
            const base64WithPadding = base64 + padding;
            const rawData = atob(base64WithPadding); // base64 -> 原始資料
            const uint8Array = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; i++) {
                uint8Array[i] = rawData.charCodeAt(i);
            }
            return uint8Array;
        }

        // 將 Uint8Array 轉換為 base64url 字串
        function uint8ArrayToBase64Url(uint8Array) {
            const binaryString = String.fromCharCode(...uint8Array);
            return btoa(binaryString)
                .replace(/\+/g, "-")
                .replace(/\//g, "_")
                .replace(/=+$/, "");
        }

        // async 函式 (WebAuthn 註冊 register)
        async function register() {
            // 取得使用者名稱
            const username = document.getElementById("username").value;
            if (!username) {
                alert("請輸入使用者名稱");
                return;
            }
            // 執行 WebAuthn 註冊
            try {
                // 向後端請求 WebAuthn 註冊選項
                const response = await fetch(
                    "https://localhost:5000/register",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username }),
                    }
                );
                // await 關鍵字會等待 response 回應後才繼續執行
                const options = await response.json();
                console.log("註冊選項:", options);
                // 判斷 options 是否 error
                if (options.error) {
                    console.error("註冊錯誤:", options.error);
                    alert("註冊失敗:" + options.error + "！");
                    return;
                }

                // 後端正確回應後，將 options 轉換為 WebAuthn API 可用的格式
                // 原本的 challenge 和 user.id 都是 base64url 字串
                // 需要轉換為 Uint8Array 格式
                options.challenge = base64UrlToUint8Array(
                    options.challenge
                );
                options.user.id = base64UrlToUint8Array(options.user.id);

                // 之後將憑證資訊儲存到瀏覽器的 API 中
                const credential = await navigator.credentials.create({
                    publicKey: options,
                });
                console.log("瀏覽器已註冊憑證:", credential);

                // 將 publicKeyCredential 傳給後端儲存
                const response2 = await fetch(
                    "https://localhost:5000/store-credential",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            username: username,
                            credential: {
                                id: credential.id,
                                rawId: arrayBufferToBase64(credential.rawId),
                                response: {
                                    attestationObject: arrayBufferToBase64(
                                        credential.response.attestationObject
                                    ),
                                    clientDataJSON: arrayBufferToBase64(
                                        credential.response.clientDataJSON
                                    ),
                                },
                                type: credential.type,
                            },
                        }),
                    }
                );

                // 顯示憑證資訊在網頁上
                document.getElementById(
                    "Register_credentialInfo"
                ).textContent =
                    "User : " +
                    username +
                    "\n" +
                    JSON.stringify(credential, null, 2);

                alert("註冊成功！請查看憑證資訊，接下來嘗試認證看看。");
            } catch (error) {
                console.error("註冊錯誤:", error);
                alert("註冊失敗:,", options.error, "！");
            }
        } // end of register()

        // async 函式 (WebAuthn 向後端確認使用者存在並取得憑證)
        async function verify_register() {

            console.log("細分驗證流程");
            console.log("1.向後端確認使用者存在");
            // 取得使用者名稱
            const username = document.getElementById("username").value;
            if (!username) {
                alert("請輸入使用者名稱");
                return;
            }

            try {
                // POST 到 /verify-register
                const response = await fetch(
                    "https://localhost:5000/verify-register",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username }),
                    }
                );
                // 取得後端回應
                const options = await response.json();
                console.log("認證選項:", options);
                if (options.error) {
                    console.error("認證錯誤(後端回應 error):", options.error);
                    alert("認證失敗(後端回應 error):" + options.error + "！");
                    return;
                }
                console.log("2.後端回傳使用者資料再從瀏覽器取得憑證");
                // 將 options 轉換為 WebAuthn API 可用的格式
                options.challenge = base64UrlToUint8Array(
                    options.challenge
                );

                // 認證憑證
                const credential = await navigator.credentials.get(
                    {
                    publicKey: {
                        challenge: (options.challenge),
                        rpId: "localhost",
                        userVerification: "required"  
                    // publicKey: options,
                        }
                    }
                );
                console.log("瀏覽器已認證憑證:", credential);
                // 顯示憑證資訊在網頁上
                document.getElementById(
                    "verify-register_credentialInfo"
                ).textContent =
                    "User : " +
                    username +
                    "\n" +
                    JSON.stringify(credential, null, 2);

                console.log("3.將憑證傳給後端完成登入");
                // 將認證結果傳送給後端進行驗證
                const verifyResponse = await fetch("https://localhost:5000/verify-credential", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: username,
                        credential: {
                            id: credential.id,
                            rawId: arrayBufferToBase64(credential.rawId),
                            response: {
                                clientDataJSON: arrayBufferToBase64(credential.response.clientDataJSON),
                                authenticatorData: arrayBufferToBase64(credential.response.authenticatorData),
                                signature: arrayBufferToBase64(credential.response.signature),
                                userHandle: credential.response.userHandle ? arrayBufferToBase64(credential.response.userHandle) : null,
                            },
                            type: credential.type,
                        },
                    }),
                });

                const verifyResult = await verifyResponse.json();
                console.log("登入驗證結果:", verifyResult);

                if (verifyResult.error) {
                    console.error("登入驗證錯誤:", verifyResult.error);
                    alert("登入驗證失敗:" + verifyResult.error + "！");
                    return;
                }




                alert("認證成功！");
            } catch (error) {
                console.error("認證錯誤:", error);
                alert("認證失敗！");
            }
        } // end of verify_register()

        // 清除憑證資訊
        async function clearData() {
            document.getElementById("Register_credentialInfo").textContent =
                "";
            document.getElementById(
                "verify-register_credentialInfo"
            ).textContent = "";
            globol_credential = null;

            try {
                const response = await fetch(
                    "https://localhost:5000/clear",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify("No Data"),
                    }
                );

                const result = await response.json();
                console.log("清除結果:", result);
                // 清除前端瀏覽器中的憑證
                await navigator.credentials.preventSilentAccess();
                console.log("前端瀏覽器中的憑證已清除");
                alert("憑證資訊已清除！");
            } catch (error) {
                console.error("清除錯誤:", error);
                alert("清除失敗！");
            }
        } // end of clear()
    </script>
</body>

</html>
