<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>首頁</title>
    <script>
        function openOAuthPopup() {
            const popup = window.open(
                "/oauth2/authorize?client_id=test-client&redirect_uri=/oauth/callback&state=abc123&response_type=code",
                "oauth_popup",
                "width=750,height=400,resizable=no,scrollbars=no,toolbar=no,menubar=no"
            );

            window.addEventListener("message", (event) => {
                // 建議加上 origin 驗證
                console.log("收到 popup 回傳資料：", event.data);

                if (event.data.token) {
                    alert("登入成功！收到 Token: " + event.data.token);
                    // 可以儲存到 localStorage 或觸發登入邏輯
                }
            });
        }
    </script>
</head>

<body>
    <h1>Hello, World!</h1>
    <p><a href="/main">點擊進入 WebAuthn 環節</a></p>
    <p><a href="#" onclick="openOAuthPopup(); return false;">點擊進入 OAuth 環節（彈出視窗）</a></p>
    <p><a href="https://fido2-web.akitawan.moe/oauth2/.well-known/jwks.json">公開金鑰</a></p>
</body>

</html>
